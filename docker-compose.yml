version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mrdevcourses-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mrdevcourses_db
      POSTGRES_USER: mrdev_user
      POSTGRES_PASSWORD: mrdev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrdev_user -d mrdevcourses_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mrdevcourses-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mrdevcourses_db
      SPRING_DATASOURCE_USERNAME: mrdev_user
      SPRING_DATASOURCE_PASSWORD: mrdev_password
      APP_JWT_SECRET: dev-jwt-secret-key-must-be-at-least-256-bits-long-mrdevcourses
      APP_CORS_ALLOWED_ORIGINS: http://localhost:80,http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mrdevcourses-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
