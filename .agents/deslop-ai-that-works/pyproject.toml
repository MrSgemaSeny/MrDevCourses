[project]
name = "deslop"
version = "0.2.0"
description = "CLI tool to rewrite documents so they sound less like AI slop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AI That Works Contributors" }
]
keywords = ["ai", "writing", "editing", "cli", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
dependencies = [
    "baml-py==0.220.0",
    "pydantic>=2.0",
]

[project.scripts]
deslop = "deslop.cli:main"

[project.urls]
Homepage = "https://github.com/ai-that-works/deslop"
Repository = "https://github.com/ai-that-works/deslop"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deslop", "src/baml_client"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "baml_src/",
    "README.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
