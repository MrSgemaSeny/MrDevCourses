spring:
  application:
    name: MrDeveloper
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days (7 * 24 * 60 * 60 * 1000)
    remember-me-expiration-ms: ${JWT_REMEMBER_ME_EXPIRATION_MS:2592000000} # 30 days (30 * 24 * 60 * 60 * 1000)
    cookie-name: ${JWT_COOKIE_NAME:MrDev_token}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:MrDevelopersbot}
    chat-id: ${TELEGRAM_CHAT_ID:}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
