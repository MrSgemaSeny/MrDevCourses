server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${FRONTEND_URL:https://courses.mrsgemaseny.com}/api/login/oauth2/code/{registrationId}"

app:
  jwt:
    secret: ${JWT_SECRET}
    cookie-secure: true
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://courses.mrsgemaseny.com,https://mr-dev-courses.vercel.app,http://localhost:5173,http://localhost:3000}
  frontend-url: ${FRONTEND_URL:https://courses.mrsgemaseny.com}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}

logging:
  level:
    com.mrdev: INFO
    org.springframework.security: WARN
