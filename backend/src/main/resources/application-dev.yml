spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/MrDev}
    username: ${DB_USERNAME:test_user}
    password: ${DB_PASSWORD:pass1}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

logging:
  level:
    com.mrdev: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
